[project]
name = "databricks-governance-app"
version = "0.1.0"
description = "Federated data access governance app for Databricks Unity Catalog"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D"]
# B027: optional lifecycle hooks on abstract base classes are intentionally no-ops.
# D107: constructor arguments are documented in the class docstring (Google style).
ignore = ["B027", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Seed data and ABAC condition strings read better unwrapped.
"provisioning/steps/*" = ["E501", "D"]
"provisioning/*" = ["D"]
"scripts/*" = ["D"]
"backend/tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["backend/app"]
branch = false

[tool.coverage.report]
# Thin infrastructure adapters are exercised through the in-memory repositories and the
# service-level fakes, not against live Lakebase, Delta, SQL warehouses, or the workspace SDK.
omit = [
    # SQL-string adapters for Lakebase Postgres and Delta; live-only behavior.
    "backend/app/repositories/lakebase.py",
    "backend/app/repositories/delta.py",
    # Thin wrappers around the Databricks SDK and SQL warehouse; exercised in deployed runs.
    "backend/app/clients/workspace.py",
    "backend/app/clients/sql.py",
    # Process entrypoint (uvicorn startup); create_app is covered by test_api.py.
    "backend/app/main.py",
]
show_missing = true
skip_covered = false
fail_under = 90
