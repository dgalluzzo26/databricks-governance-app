resources:
  apps:
    governance_app:
      name: ${var.app_name}
      description: Federated data access governance for Unity Catalog
      source_code_path: ..
      config:
        command:
          - python
          - -m
          - backend.app.main
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: STORAGE_BACKEND
            value: ${var.storage_backend}
          - name: APP_CATALOG
            value: ${var.app_catalog}
          - name: APP_SCHEMA
            value: ${var.app_schema}
          - name: DEMO_CATALOG
            value: ${var.demo_catalog}
          - name: APP_ADMIN_GROUP
            value: ${var.admin_group}
          # Account Admin SP for metastore-level ABAC (from secret scope).
          - name: ADMIN_SECRET_SCOPE
            value: ${var.admin_secret_scope}
          - name: ADMIN_CLIENT_ID
            value_from: admin-client-id
          - name: ADMIN_CLIENT_SECRET
            value_from: admin-client-secret
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: ${resources.postgres_projects.app_lakebase.name}/branches/production
            database: ${resources.postgres_databases.app_database.name}
            permission: CAN_CONNECT_AND_CREATE
        - name: admin-client-id
          secret:
            scope: ${var.admin_secret_scope}
            key: client_id
            permission: READ
        - name: admin-client-secret
          secret:
            scope: ${var.admin_secret_scope}
            key: client_secret
            permission: READ
