resources:
  apps:
    governance_app:
      name: ${var.app_name}
      description: Federated data access governance for Unity Catalog
      source_code_path: ..
      # Requests are spread across instances; each holds its own in-process caches.
      compute_size: ${var.app_compute_size}
      compute_min_instances: ${var.app_min_instances}
      compute_max_instances: ${var.app_max_instances}
      # System logs and usage events land in the app catalog; spans/metrics need custom OTEL.
      # Tables are created on first deploy if missing (app SP already has USE/SELECT/MODIFY on app).
      telemetry_export_destinations:
        - unity_catalog:
            logs_table: ${var.app_catalog}.${var.app_schema}.otel_logs
            metrics_table: ${var.app_catalog}.${var.app_schema}.otel_metrics
            traces_table: ${var.app_catalog}.${var.app_schema}.otel_spans
      config:
        command:
          - python
          - -m
          - backend.app.main
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: STORAGE_BACKEND
            value: ${var.storage_backend}
          - name: APP_CATALOG
            value: ${var.app_catalog}
          - name: APP_SCHEMA
            value: ${var.app_schema}
          - name: APP_ADMIN_GROUP
            value: ${var.admin_group}
          # Account Admin SP for metastore-level ABAC (from secret scope).
          - name: ADMIN_SECRET_SCOPE
            value: ${var.admin_secret_scope}
          - name: ADMIN_CLIENT_ID
            value_from: admin-client-id
          - name: ADMIN_CLIENT_SECRET
            value_from: admin-client-secret
          # Job that owns the data-access schedule; Run now triggers it and waits.
          - name: DATA_ACCESS_SYNC_JOB_ID
            value_from: data-access-sync-job
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${resources.sql_warehouses.app_warehouse.id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: ${resources.postgres_projects.app_lakebase.name}/branches/production
            database: ${resources.postgres_databases.app_database.name}
            permission: CAN_CONNECT_AND_CREATE
        - name: admin-client-id
          secret:
            scope: ${var.admin_secret_scope}
            key: client_id
            permission: READ
        - name: admin-client-secret
          secret:
            scope: ${var.admin_secret_scope}
            key: client_secret
            permission: READ
        - name: data-access-sync-job
          job:
            id: ${resources.jobs.data_access_sync.id}
            permission: CAN_MANAGE
