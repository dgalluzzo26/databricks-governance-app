resources:
  jobs:
    setup_job:
      name: ${var.app_name}-setup
      description: Idempotent setup for the Data Governance App (app catalog, Delta tables, UDFs, grants)
      max_concurrent_runs: 1
      tasks:
        - task_key: provision
          environment_key: default
          spark_python_task:
            python_file: ../provisioning/run_setup.py
            parameters:
              - --warehouse-id
              - ${var.warehouse_id}
              - --app-name
              - ${resources.apps.governance_app.name}
              - --app-catalog
              - ${var.app_catalog}
              - --app-schema
              - ${var.app_schema}
              - --catalog-managed-location
              - ${var.catalog_managed_location}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk==0.163.0
