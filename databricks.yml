# Data Governance App: one bundle provisions everything the app needs.
#
#   ./scripts/deploy.sh <target>            # build UI, deploy bundle, run setup, start app
#
# Override any variable per target below, or at deploy time with --var name=value.
bundle:
  name: data-governance-app

include:
  - resources/*.yml

variables:
  app_name:
    description: Databricks App name (lowercase, hyphens, <= 26 chars)
    default: data-governance-app
  app_catalog:
    description: Catalog that holds the app's own Delta tables
    default: data_governance_app
  app_schema:
    description: Schema for the app's Delta tables
    default: app
  catalog_managed_location:
    description: Storage location for new catalogs; empty uses the metastore root or Default Storage
    default: ""
  storage_backend:
    description: Where the app stores its state (lakebase | delta)
    default: lakebase
  lakebase_project_id:
    description: Lakebase project ID for app state
    default: data-governance-app
  lakebase_database_id:
    description: Lakebase database ID inside the production branch
    default: governance
  admin_group:
    description: Group whose members are app administrators
    default: admins
  admin_secret_scope:
    description: Secret scope holding Account Admin SP client_id / client_secret (metastore ABAC)
    default: databricks-governance-app
  app_compute_size:
    description: App instance size (MEDIUM | LARGE | XLARGE)
    default: MEDIUM
  app_min_instances:
    description: >
      Minimum app instances (horizontal scaling). Workspaces without app autoscaling require
      min and max to be equal (fixed scaling).
    default: 2
  app_max_instances:
    description: Maximum app instances (horizontal scaling); equal to the minimum unless autoscaling is enabled
    default: 2
  warehouse_min_clusters:
    description: SQL warehouse minimum clusters
    default: 1
  warehouse_max_clusters:
    description: SQL warehouse maximum clusters (concurrent users queue above this)
    default: 4
  sync_job_run_as_sp:
    description: >
      Application ID of the Account Admin SP that runs the data-access sync Job. Must match
      the admin SP in the secret scope (admin-client-id). The deployer needs Use on it.
    default: bbf03021-a1ad-4721-a6a3-ddd500982f72

sync:
  exclude:
    - .venv
    - frontend/node_modules
    - frontend/src
    - frontend/public/help-images
    - frontend/screenshots
    - backend/tests
  include:
    - frontend/dist/**

targets:
  # Resource names are not prefixed, so catalogs and the app keep the names configured above.
  dev:
    default: true
    workspace:
      host: https://dbc-16303671-e52d.cloud.databricks.com
      profile: dbc-16303671-e52d

  # New demo workspace (same Account Admin SP as the other targets). Secrets for the SP live in
  # the databricks-governance-app scope created in this workspace.
  gov-demo:
    workspace:
      host: https://dbc-f05a69a4-3e7a.cloud.databricks.com
      profile: gov-demo
    variables:
      sync_job_run_as_sp: c300a3e9-7bea-4035-9022-b0b1346ec68f

  # Same workspace, Delta storage backend. Uses its own names because each bundle target
  # owns the resources it creates.
  dev-delta:
    workspace:
      host: https://dbc-16303671-e52d.cloud.databricks.com
      profile: dbc-16303671-e52d
    variables:
      app_name: data-governance-app-dlt
      storage_backend: delta
      app_catalog: data_governance_app_delta
      lakebase_project_id: data-governance-app-dlt
